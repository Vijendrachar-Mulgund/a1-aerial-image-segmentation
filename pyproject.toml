[project]
name = "aerial-segmentation"
version = "0.1.0"
description = "Semantic segmentation of road, divider and sidewalk in aerial imagery"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # ultralytics is AGPL-3.0. See CLAUDE.md - the license question is open,
    # and this dependency is what makes it open.
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0",
]

[dependency-groups]
train = ["roboflow>=1.1.0"]
dev = ["ruff>=0.6.0", "pytest>=8.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]